# See app.prod-gcp.yaml or app.dev-gcp.yaml for per env mixins values.
# https://docs.nais.io/build/explanations/environment-mixins/
apiVersion: 'nais.io/v1alpha1'
kind: 'Application'
metadata:
  name: syk-inn
  namespace: tsm
  labels:
    team: tsm
spec:
  port: 3000
  login:
    provider: openid
    enforce:
      enabled: true
      excludePaths:
        - /samarbeidspartner/sykmelding/fhir/callback
        - /samarbeidspartner/sykmelding/fhir/launch
        - /samarbeidspartner/sykmelding/fhir/error/**
        - /samarbeidspartner/sykmelding/api/**
        - /samarbeidspartner/sykmelding/jwk.json
  azure:
    application:
      enabled: true
  valkey:
    - instance: syk-inn
      access: readwrite
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  prometheus:
    enabled: true
    path: /samarbeidspartner/sykmelding/api/internal/metrics
  liveness:
    path: /samarbeidspartner/sykmelding/api/internal/is_alive
  readiness:
    path: /samarbeidspartner/sykmelding/api/internal/is_ready
  preStopHook:
    http:
      path: /samarbeidspartner/sykmelding/api/internal/pre_stop
  filesFrom:
    - emptyDir:
        medium: Memory
      mountPath: /app/.next/cache
  accessPolicy:
    outbound:
      external:
        - host: 'tsm-unleash-api.nav.cloud.nais.io'
      rules:
        - application: syk-inn-api
        - application: tsm-pdl-cache
        # Team Logs: https://docs.nais.io/observability/logging/how-to/team-logs/
        - application: logging
          namespace: nais-system
  envFrom:
    - secret: login-config-syk-inn
    - secret: tsm-syk-inn-epj-secrets
    - secret: tsm-syk-inn-slack-secrets
    - secret: tsm-unleash-api-token
