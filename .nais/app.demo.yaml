# As opposed to app.yaml + app.<prod-gcp|dev-gcp>.yaml, this is a complete naiserator manifest, because the demo-environment is quite different, and would not work with mixins.
apiVersion: 'nais.io/v1alpha1'
kind: 'Application'
metadata:
  name: 'syk-inn-demo'
  namespace: tsm
  labels:
    team: tsm
spec:
  port: 3000
  ingresses:
    - 'https://syk-inn.ekstern.dev.nav.no/samarbeidspartner/sykmelding'
  replicas:
    min: 1
    max: 1
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  liveness:
    path: /samarbeidspartner/sykmelding/api/internal/is_alive
  readiness:
    path: /samarbeidspartner/sykmelding/api/internal/is_ready
  preStopHook:
    http:
      path: /samarbeidspartner/sykmelding/api/internal/pre_stop
  filesFrom:
    - emptyDir:
        medium: Memory
      mountPath: /app/.next/cache
  accessPolicy:
    outbound:
      external:
        - host: 'launch.smarthealthit.org'
        - host: 'syk-inn.ekstern.dev.nav.no'
        - host: 'tsm-unleash-api.nav.cloud.nais.io'
  resources:
    limits:
      memory: 600Mi
    requests:
      cpu: 50m
      memory: 400Mi
  envFrom:
    - configmap: syk-inn-demo-forms
  env:
    - name: HELSEID_URL
      value: https://syk-inn.ekstern.dev.nav.no/samarbeidspartner/sykmelding/api/mocks/helseid
